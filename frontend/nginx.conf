server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Build explanations from a slow local model can take a minute.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
